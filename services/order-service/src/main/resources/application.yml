server:
  port: 8080
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      pool-name: OrderServicePool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        show_sql: false
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVICE_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:9000}/.well-known/jwks.json

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: BASIC
          payment-service:
            connect-timeout: 2000
            read-timeout: 8000
          fraud-service:
            connect-timeout: 2000
            read-timeout: 15000

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  cloudwatch:
    metrics:
      export:
        namespace: FinPay/OrderService
        enabled: ${CLOUDWATCH_ENABLED:false}
        step: 60s

logging:
  level:
    com.finpay.order: INFO
    com.finpay.order.client: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}",
      "level":"%p",
      "service":"order-service",
      "traceId":"%X{traceId}",
      "spanId":"%X{spanId}",
      "thread":"%t",
      "class":"%logger{36}",
      "message":"%m"}%n

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

spring.data.web:
  pageable:
    default-page-size: 20
    max-page-size: 100
    one-indexed-parameters: false

app:
  order:
    saga-timeout-seconds: 30
    optimistic-lock-retries: 3
  feign:
    payment-service:
      url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
    fraud-service:
      url: ${FRAUD_SERVICE_URL:http://localhost:8083}
  jwt:
    roles-claim: roles
